<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link rel="icon" type="image/png" sizes="192x192" href="./lore-guide-favicon-watercolor-v2.png" />
    <link rel="preload" as="image" href="./cinematic/default/gateway/cosmic-frames-v9/frame-00.webp" fetchpriority="high" />
    <link rel="preload" as="image" href="./cinematic/ui/boot-celestial-v1.webp" />
    <meta name="theme-color" content="#080806" />
    <meta name="description" content="Prerak Pandey - backend and full-stack engineer building game-technology systems, Unreal tooling, pipelines, and telemetry platforms." />
    <meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data: blob:; media-src 'self' blob:; font-src 'self' data:; connect-src 'self' ws://127.0.0.1:*; object-src 'none'; base-uri 'self'; form-action 'none'" />
    <title>Prerak Pandey | Aegis Systems Archive</title>
    <style>
      @font-face {
        font-family: "Morrison Boot";
        src: url("%BASE_URL%fonts/Morrison-Regular.otf") format("opentype");
        font-style: normal;
        font-weight: 400;
        font-display: swap;
      }
      #boot-loader {
        --boot-progress: 0;
        position: fixed;
        inset: 0;
        z-index: 9999;
        display: grid;
        place-items: center;
        overflow: hidden;
        background: #050504;
        color: #e9e2d6;
        font-family: "Morrison Boot", "Arial Narrow", sans-serif;
        visibility: visible;
        opacity: 1;
        contain: strict;
        transition: opacity 620ms ease, visibility 0ms linear 640ms;
      }
      #boot-loader.is-complete {
        visibility: hidden;
        opacity: 0;
      }
      #boot-loader.is-canvas-covered {
        visibility: hidden;
        opacity: 0;
        transition: none;
      }
      .boot-scene {
        position: absolute;
        inset: 0;
        overflow: hidden;
        pointer-events: none;
        perspective: 1600px;
      }
      .boot-image-stage {
        position: absolute;
        top: 50%;
        left: 50%;
        width: max(100vw, 177.7778vh);
        aspect-ratio: 16 / 9;
        transform: translate(-50%, -50%) scale(1.005);
        transform-origin: 50% 55%;
        transform-style: preserve-3d;
      }
      .boot-frame {
        position: absolute;
        inset: -1.8%;
        width: 103.6%;
        height: 103.6%;
        object-fit: cover;
        filter: saturate(.32) brightness(.48) contrast(1.1);
        transform: translate3d(-.2%, .14%, 0) scale(1.018);
        transform-origin: 50% 55%;
      }
      .boot-ritual {
        position: relative;
        z-index: 4;
        width: min(760px, calc(100vw - 40px));
        display: grid;
        grid-template-columns: 178px minmax(0, 1fr);
        align-items: center;
        gap: clamp(24px, 5vw, 58px);
        isolation: isolate;
      }
      .boot-astrolabe {
        position: relative;
        width: 178px;
        aspect-ratio: 1;
        display: grid;
        place-items: center;
        filter: drop-shadow(0 20px 34px rgba(0, 0, 0, .72));
        transition: opacity 420ms ease, transform 820ms cubic-bezier(.16,.8,.22,1), filter 620ms ease;
      }
      .boot-celestial {
        position: relative;
        z-index: 2;
        width: 112px;
        height: 112px;
        object-fit: contain;
        filter: saturate(.48) brightness(.9) contrast(1.08);
        animation: bootCelestialDrift 8s ease-in-out infinite;
      }
      .boot-orbit {
        position: absolute;
        inset: 11px;
        border: 1px solid rgba(221, 193, 141, .28);
        border-radius: 50%;
        opacity: .72;
        transform: rotate(-18deg) scaleY(.58);
        box-shadow: 0 0 18px rgba(207, 173, 111, .08);
        animation: bootOrbitTurn 12s linear infinite;
      }
      .boot-orbit::before,
      .boot-orbit::after {
        content: "";
        position: absolute;
        border-radius: 50%;
        border: 1px solid rgba(217, 188, 130, .18);
      }
      .boot-orbit::before { inset: 12px -9px; transform: rotate(38deg) scaleY(.76); }
      .boot-orbit::after { inset: -8px 19px; transform: rotate(-51deg) scaleX(.72); }
      .boot-orbit-head {
        position: absolute;
        z-index: 3;
        top: 29px;
        right: 18px;
        width: 5px;
        height: 5px;
        border-radius: 50%;
        background: #ecd59c;
        box-shadow: 0 0 8px #d8ae62, 0 0 22px rgba(216, 174, 98, .56);
        animation: bootOrbitPulse 2.6s ease-in-out infinite;
      }
      .boot-copy {
        position: relative;
        min-width: 0;
        padding: 19px 0 22px 28px;
        transition: opacity 440ms ease, transform 680ms cubic-bezier(.16,.8,.22,1);
      }
      .boot-copy::before {
        content: "";
        position: absolute;
        top: 7px;
        bottom: 7px;
        left: 0;
        width: 1px;
        background: rgba(222, 193, 138, .36);
        box-shadow: 0 0 12px rgba(217, 179, 108, .16);
      }
      .boot-copy-content {
        position: relative;
        z-index: 1;
        width: 100%;
        display: grid;
        gap: 13px;
      }
      .boot-kicker {
        margin: 0;
        color: rgba(235, 225, 208, .56);
        font-size: 11px;
        letter-spacing: .18em;
        text-transform: uppercase;
        transition: opacity 300ms ease, translate 500ms cubic-bezier(.16,.8,.22,1);
      }
      .boot-copy-heading {
        display: flex;
        align-items: baseline;
        justify-content: space-between;
        gap: 18px;
        color: #f2e9da;
        text-shadow: 0 2px 4px rgba(0, 0, 0, .9);
        transition: opacity 340ms ease, translate 560ms cubic-bezier(.16,.8,.22,1);
      }
      .boot-copy-heading span {
        min-width: 0;
        font-size: 15px;
        text-transform: uppercase;
      }
      .boot-copy-heading strong {
        color: #e0bf7b;
        font-size: 17px;
        font-weight: 400;
        font-variant-numeric: tabular-nums;
      }
      .boot-masonry-progress {
        position: relative;
        height: 13px;
        overflow: hidden;
        padding: 3px;
        background:
          linear-gradient(180deg, rgba(0,0,0,.82), rgba(22,18,13,.94)),
          url("%BASE_URL%cinematic/default/ui/control-slab-gate-watercolor-v10.webp") center / 210% auto;
        box-shadow:
          inset 0 3px 8px rgba(0,0,0,.96),
          0 1px 0 rgba(221, 190, 131, .18),
          0 8px 22px rgba(0,0,0,.28);
        clip-path: polygon(0 20%, 2% 4%, 21% 9%, 39% 2%, 62% 7%, 81% 1%, 99% 12%, 100% 78%, 97.5% 98%, 75% 91%, 52% 99%, 30% 93%, 1% 100%);
        transition: opacity 320ms ease, translate 520ms cubic-bezier(.16,.8,.22,1);
      }
      .boot-masonry-progress i {
        display: block;
        width: 100%;
        height: 100%;
        transform: scaleX(var(--boot-progress));
        transform-origin: 0 50%;
        background:
          linear-gradient(90deg, rgba(133,96,43,.76), #d6b36b 56%, #f0db9f),
          repeating-linear-gradient(105deg, transparent 0 8px, rgba(20,13,6,.2) 9px 10px);
        box-shadow: 0 0 12px rgba(214, 179, 107, .32);
        transition: transform 120ms linear;
      }
      .boot-status {
        margin: 0;
        color: rgba(235, 225, 208, .42);
        font-size: 10px;
        letter-spacing: .08em;
        text-transform: uppercase;
        transition: opacity 260ms ease, translate 460ms cubic-bezier(.16,.8,.22,1);
      }
      #boot-loader.is-transitioning .boot-status,
      #boot-loader.is-complete .boot-status {
        opacity: 0;
        translate: 0 7px;
      }
      #boot-loader.is-transitioning .boot-masonry-progress,
      #boot-loader.is-complete .boot-masonry-progress {
        opacity: 0;
        translate: 0 6px;
        transition-delay: 70ms;
      }
      #boot-loader.is-transitioning .boot-copy-heading,
      #boot-loader.is-complete .boot-copy-heading {
        opacity: 0;
        translate: 0 -5px;
        transition-delay: 130ms;
      }
      #boot-loader.is-transitioning .boot-kicker,
      #boot-loader.is-complete .boot-kicker {
        opacity: 0;
        translate: 0 -8px;
        transition-delay: 190ms;
      }
      #boot-loader.is-transitioning .boot-copy,
      #boot-loader.is-complete .boot-copy {
        opacity: 0;
        transform: translate3d(12px, 0, 0);
        transition-delay: 240ms;
      }
      #boot-loader.is-transitioning .boot-astrolabe,
      #boot-loader.is-complete .boot-astrolabe {
        opacity: 0;
        filter: drop-shadow(0 20px 34px rgba(0, 0, 0, .38)) blur(.6px);
        transform: scale(1.12);
        transition-delay: 80ms;
      }
      @keyframes bootCelestialDrift {
        0%, 100% { transform: translate3d(0, -1px, 0) rotate(-.4deg); }
        50% { transform: translate3d(0, 2px, 0) rotate(.5deg); }
      }
      @keyframes bootOrbitTurn {
        from { transform: rotate(-18deg) scaleY(.58); }
        to { transform: rotate(342deg) scaleY(.58); }
      }
      @keyframes bootOrbitPulse {
        0%, 100% { opacity: .48; transform: scale(.72); }
        50% { opacity: 1; transform: scale(1.14); }
      }
      @media (prefers-reduced-motion: reduce) {
        #boot-loader,
        .boot-astrolabe,
        .boot-copy,
        .boot-copy-heading,
        .boot-kicker,
        .boot-status,
        .boot-orbit,
        .boot-orbit-head,
        .boot-celestial,
        .boot-masonry-progress i { transition-duration: 1ms; }
      }
      @media (max-width: 620px) {
        .boot-ritual {
          width: min(430px, calc(100vw - 34px));
          grid-template-columns: 112px minmax(0, 1fr);
          gap: 18px;
        }
        .boot-astrolabe { width: 112px; }
        .boot-celestial { width: 76px; height: 76px; }
        .boot-orbit-head { top: 18px; right: 11px; }
        .boot-copy {
          padding: 15px 0 17px 18px;
        }
        .boot-copy-heading span { font-size: 12px; }
        .boot-copy-heading strong { font-size: 14px; }
        .boot-kicker, .boot-status { font-size: 8px; }
      }
    </style>
  </head>
  <body>
    <div id="boot-loader" aria-label="Loading the Aegis systems archive">
      <div class="boot-scene" aria-hidden="true">
        <div class="boot-image-stage">
          <picture>
            <source
              media="(max-width: 1680px)"
              srcset="./cinematic/default/gateway/cosmic-frames-v9-compact/frame-00.webp"
            />
            <img
              id="boot-gateway-frame"
              class="boot-frame"
              src="./cinematic/default/gateway/cosmic-frames-v9/frame-00.webp"
              fetchpriority="high"
              alt=""
            />
          </picture>
        </div>
      </div>
      <div class="boot-ritual">
        <div class="boot-astrolabe" aria-hidden="true">
          <span class="boot-orbit"></span>
          <img class="boot-celestial" src="./cinematic/ui/boot-celestial-v1.webp" alt="" />
          <i class="boot-orbit-head"></i>
        </div>
        <div class="boot-copy">
          <div class="boot-copy-content">
            <p class="boot-kicker">A passage through the archive</p>
            <div class="boot-copy-heading">
              <span id="boot-progress-label">Tracing the passage</span>
              <strong id="boot-progress">000</strong>
            </div>
            <div id="boot-progress-track" class="boot-masonry-progress" role="progressbar" aria-labelledby="boot-progress-label" aria-valuemin="0" aria-valuemax="100" aria-valuenow="0">
              <i aria-hidden="true"></i>
            </div>
            <p class="boot-status">Preparing motion, contours, and painted worlds</p>
          </div>
        </div>
      </div>
    </div>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
