<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link rel="icon" type="image/png" sizes="192x192" href="./lore-guide-favicon-watercolor-v2.png" />
    <link rel="preload" as="image" href="./cinematic/painted-v1/default/light/home.webp" fetchpriority="high" />
    <link rel="preload" as="image" href="./cinematic/painted-v1/ui/loader-brush.webp" />
    <meta name="theme-color" content="#080806" />
    <meta name="description" content="Prerak Pandey - backend and full-stack engineer building game-technology systems, Unreal tooling, pipelines, and telemetry platforms." />
    <meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data: blob:; media-src 'self' blob:; font-src 'self' data:; connect-src 'self' ws://127.0.0.1:*; object-src 'none'; base-uri 'self'; form-action 'none'" />
    <title>Prerak Pandey | Aegis Systems Archive</title>
    <style>
      @font-face {
        font-family: "Morrison Boot";
        src: url("%BASE_URL%fonts/Morrison-Regular.otf") format("opentype");
        font-style: normal;
        font-weight: 400;
        font-display: swap;
      }
      @property --boot-progress {
        syntax: "<number>";
        inherits: true;
        initial-value: 0;
      }
      #boot-loader {
        --boot-progress: 0;
        position: fixed;
        inset: 0;
        z-index: 9999;
        overflow: hidden;
        background: #efefed;
        color: #25282b;
        font-family: "Morrison Boot", "Arial Narrow", sans-serif;
        visibility: visible;
        opacity: 1;
        contain: strict;
        transition: --boot-progress 420ms cubic-bezier(.2,.65,.3,1), opacity 620ms ease, visibility 0ms linear 640ms;
      }
      #boot-loader.is-complete { visibility: hidden; opacity: 0; }
      #boot-loader.is-canvas-covered { visibility: hidden; opacity: 0; transition: none; }
      .boot-scene, .boot-image-stage { position: absolute; inset: 0; pointer-events: none; }
      .boot-frame {
        width: 100%;
        height: 100%;
        object-fit: cover;
        filter: grayscale(1);
      }
      .boot-ritual {
        position: absolute;
        z-index: 4;
        width: min(460px, calc(100% - 48px));
        left: 50%;
        bottom: max(8vh, 36px);
        transform: translateX(-50%);
        isolation: isolate;
      }
      .boot-copy {
        position: relative;
        min-width: 0;
        transition: opacity 650ms ease, translate 800ms cubic-bezier(.16,.8,.22,1);
      }
      .boot-copy-content { position: relative; display: grid; gap: 8px; }
      .boot-kicker, .boot-status {
        margin: 0;
        font: 13px/1.4 "Arial Narrow", Arial, sans-serif;
        letter-spacing: 0;
        text-align: center;
        text-shadow: 0 0 3px #fff, 0 0 10px #fff;
      }
      .boot-kicker { color: #343a3f; }
      .boot-status { color: #46505a; font-size: 12px; }
      .boot-copy-heading {
        display: flex;
        align-items: baseline;
        justify-content: space-between;
        gap: 18px;
        color: #25282b;
        text-shadow: 0 0 3px #fff, 0 0 10px #fff;
      }
      .boot-copy-heading span { min-width: 0; font-size: 20px; }
      .boot-copy-heading strong { font-size: 20px; font-weight: 400; font-variant-numeric: tabular-nums; }
      .boot-paint-progress {
        position: relative;
        height: 36px;
        isolation: isolate;
      }
      .boot-paint-progress::before, .boot-paint-progress i {
        content: "";
        position: absolute;
        inset: 0;
        background: url("%BASE_URL%cinematic/painted-v1/ui/loader-brush.webp") center / 100% 100% no-repeat;
      }
      .boot-paint-progress::before { opacity: .15; }
      .boot-paint-progress i {
        opacity: clamp(0, calc(var(--boot-progress) * 100), 1);
        mask-image: linear-gradient(90deg,
          #000 calc(var(--boot-progress) * 112% - 8%),
          rgba(0,0,0,.85) calc(var(--boot-progress) * 112% - 5%),
          rgba(0,0,0,.22) calc(var(--boot-progress) * 112% - 1%),
          transparent calc(var(--boot-progress) * 112% + 1%));
        -webkit-mask-image: linear-gradient(90deg,
          #000 calc(var(--boot-progress) * 112% - 8%),
          rgba(0,0,0,.85) calc(var(--boot-progress) * 112% - 5%),
          rgba(0,0,0,.22) calc(var(--boot-progress) * 112% - 1%),
          transparent calc(var(--boot-progress) * 112% + 1%));
      }
      #boot-loader.is-transitioning .boot-copy,
      #boot-loader.is-complete .boot-copy {
        opacity: 0;
        translate: 0 8px;
      }
      @media (max-width: 620px) {
        .boot-ritual { bottom: max(9vh, 42px); }
        .boot-paint-progress { height: 28px; }
        .boot-copy-heading span, .boot-copy-heading strong { font-size: 18px; }
        .boot-kicker { font-size: 12px; }
        .boot-status { font-size: 11px; }
      }
      @media (prefers-reduced-motion: reduce) {
        #boot-loader, .boot-copy { transition-duration: 1ms; }
      }
    </style>
  </head>
  <body>
    <div id="boot-loader" aria-label="Loading the Aegis systems archive">
      <div class="boot-scene" aria-hidden="true">
        <div class="boot-image-stage">
          <img id="boot-gateway-frame" class="boot-frame"
            src="./cinematic/painted-v1/default/light/home.webp" fetchpriority="high" alt="" />
        </div>
      </div>
      <div class="boot-ritual">
        <div class="boot-copy">
          <div class="boot-copy-content">
            <p class="boot-kicker">A passage through the archive</p>
            <div class="boot-copy-heading">
              <span id="boot-progress-label">Laying the first wash</span>
              <strong id="boot-progress">000</strong>
            </div>
            <div id="boot-progress-track" class="boot-paint-progress" role="progressbar"
              aria-labelledby="boot-progress-label" aria-valuemin="0" aria-valuemax="100" aria-valuenow="0">
              <i aria-hidden="true"></i>
            </div>
            <p class="boot-status">Preparing the painted worlds</p>
          </div>
        </div>
      </div>
    </div>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
